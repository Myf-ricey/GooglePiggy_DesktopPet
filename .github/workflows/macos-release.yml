name: Build macOS releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install animation build dependencies
        run: python -m pip install -r requirements-macos-build.txt

      - name: Build and test native macOS release
        env:
          BUILD_UNIVERSAL: "0"
          PYTHON: python
        run: |
          chmod +x build-macos.sh macos/*.command
          ./build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GooglePiggy-macos-${{ matrix.architecture }}
          path: |
            dist/GooglePiggy-macos-${{ matrix.architecture }}.zip
            dist/GooglePiggy-macos-${{ matrix.architecture }}.dmg

      - name: Attach macOS builds to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GooglePiggy-macos-${{ matrix.architecture }}.zip
            dist/GooglePiggy-macos-${{ matrix.architecture }}.dmg
