name: Build macOS releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "!v*-windows"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install animation build dependencies
        run: python -m pip install -r requirements-macos-build.txt

      - name: Test suggested-reply task filtering
        run: |
          swiftc -framework AppKit macos/Sources/GooglePiggy/AppSupport.swift macos/Sources/GooglePiggy/FamilyStore.swift tests/suggested-replies/main.swift -o /tmp/googlepiggy-suggested-replies-test
          /tmp/googlepiggy-suggested-replies-test

      - name: Test suggestion safety review filtering
        run: |
          swiftc -framework AppKit macos/Sources/GooglePiggy/AppSupport.swift macos/Sources/GooglePiggy/FamilyStore.swift tests/suggestion-safety/main.swift -o /tmp/googlepiggy-safety-test
          /tmp/googlepiggy-safety-test

      - name: Test update checking
        run: |
          swiftc -framework AppKit macos/Sources/GooglePiggy/UpdateNotice.swift tests/update-checker/main.swift -o /tmp/googlepiggy-update-test
          /tmp/googlepiggy-update-test

      - name: Test appearance and pet decoration scaling
        run: |
          swiftc -framework AppKit macos/Sources/GooglePiggy/AppSupport.swift macos/Sources/GooglePiggy/FamilyStore.swift macos/Sources/GooglePiggy/FamilySelector.swift macos/Sources/GooglePiggy/UpdateNotice.swift macos/Sources/GooglePiggy/AppearancePreview.swift tests/appearance/main.swift -o /tmp/googlepiggy-appearance-tests
          /tmp/googlepiggy-appearance-tests
          swiftc -framework AppKit macos/Sources/GooglePiggy/UpdateNotice.swift macos/Sources/GooglePiggy/EdgeHiding.swift tests/animation-scale/main.swift -o /tmp/googlepiggy-animation-scale-test
          /tmp/googlepiggy-animation-scale-test

      - name: Install Keka
        run: |
          if [ ! -x /Applications/Keka.app/Contents/MacOS/Keka ]; then
            brew install --cask keka
          fi

      - name: Build and test native macOS release
        env:
          BUILD_UNIVERSAL: "0"
          PYTHON: python
          ZIP_PACKAGER: keka
        run: |
          chmod +x build-macos.sh macos/*.command
          ./build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GooglePiggy-macos-${{ matrix.architecture }}
          path: |
            dist/GooglePiggy-macos-${{ matrix.architecture }}.zip
            dist/GooglePiggy-macos-${{ matrix.architecture }}.dmg

      - name: Attach macOS builds to existing release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/GooglePiggy-macos-${{ matrix.architecture }}.zip" \
            "dist/GooglePiggy-macos-${{ matrix.architecture }}.dmg" \
            --clobber
